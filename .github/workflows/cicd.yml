name: CI/CD api-agiles

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Desplegar en Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: cd ~/api-agiles && git checkout master && git pull origin master && docker compose up -d --build

      - name: Probar con JMeter
        run: |
          curl -sf --retry 60 --retry-delay 5 --retry-all-errors http://${{ secrets.SERVER_HOST }}:8080/api/saludo
          curl -sL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar xz
          apache-jmeter-5.6.3/bin/jmeter -n -t jmeter/api-agiles-funcionales.jmx -Jhost=${{ secrets.SERVER_HOST }} -l resultados.jtl
          ! grep -q ',false,' resultados.jtl

      - name: Guardar resultados de JMeter
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-jmeter
          path: resultados.jtl
