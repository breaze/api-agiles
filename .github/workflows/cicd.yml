name: CI/CD api-agiles

on:
  push:
    branches: [master]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Levantar la app en la máquina de GitHub
        run: |
          printf "DB_USERNAME=root\nDB_PASSWORD=admin123\nDB_DATABASE=escuela\n" > .env
          docker compose up -d --build
          curl -sf --retry 60 --retry-delay 5 --retry-all-errors http://localhost:8080/api/saludo

      - name: Probar con JMeter
        run: |
          curl -sL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar xz
          apache-jmeter-5.6.3/bin/jmeter -n -t jmeter/api-agiles-funcionales.jmx -l resultados.jtl
          if grep ',false,' resultados.jtl; then exit 1; fi

      - name: Guardar resultados de JMeter
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultados-jmeter
          path: resultados.jtl

  deploy:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: cd ~/api-agiles && git checkout master && git pull origin master && docker compose up -d --build
